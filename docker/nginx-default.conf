# This container serves behind a TLS-terminating front proxy (MS20.2 §3.3).
# absolute_redirect off keeps directory redirects relative, so nginx never
# emits an http:// Location the client would bounce through.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
}
